<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris — IP Blocks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h2>IP Blocks</h2>
        <div class="page-header-actions">
          <button class="btn btn-primary" id="btn-add-block" data-manage-blocks>+ Add Block</button>
        </div>
      </div>

      <div class="filter-bar">
        <label style="margin-left:auto">Show</label>
        <select id="filter-pagesize" style="width:auto">
          <option value="15" selected>15</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>

      <div id="pagination-top" style="display:flex;align-items:center;gap:12px;justify-content:center;padding:0.5rem 0 1rem"></div>

      <div class="table-wrapper table-wrapper-sticky">
        <table>
          <thead>
            <tr>
              <th class="fav-col" title="Favorites pin to the top"></th>
              <th data-sf-key="name" data-sf-type="string">Name</th>
              <th data-sf-key="cidr" data-sf-type="ip">CIDR</th>
              <th data-sf-key="ipVersion" data-sf-type="string" data-sf-options="v4=IPv4|v6=IPv6">Version</th>
              <th data-sf-key="description" data-sf-type="string">Description</th>
              <th data-sf-key="tags" data-sf-type="array">Tags</th>
              <th data-sf-key="_count.subnets" data-sf-type="number">Networks</th>
              <th style="width:110px" data-sf-key="createdAt" data-sf-type="date">Created</th>
            </tr>
          </thead>
          <tbody id="blocks-tbody">
            <tr><td colspan="8" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="pagination" style="display:flex;align-items:center;gap:12px;justify-content:center;padding:1rem 0"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/password-self.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/passkeys-self.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/table-sf.js"></script>
  <script src="/js/favorites.js"></script>
  <script src="/js/block-panel.js"></script>
  <script src="/js/blocks.js"></script>
</body>
</html>
