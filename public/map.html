<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris — Device Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="/css/vendor/leaflet/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/css/vendor/leaflet/leaflet.draw.css">
  <link rel="stylesheet" href="/css/map.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h2>Device Map</h2>
      </div>

      <div class="map-toolbar">
        <button type="button" id="map-theme-toggle" class="btn-icon map-theme-toggle" aria-label="Toggle map theme" title="Toggle map theme (saved per user)" style="line-height:0"></button>
        <!-- The viewer's own region scope, read-only. Rendered by map.js
             (renderMyRegions) once /auth/me has answered. -->
        <div class="map-my-regions" id="map-my-regions" hidden></div>
        <!-- Read-only, and deliberately NOT permission-gated: any viewer who
             can see the map can see how its regions nest. Hovering it shows the
             containment tree (region-tree.js + the shared hover tooltip). -->
        <button type="button" id="map-show-regions" class="btn btn-secondary" aria-pressed="false">Show regions</button>
        <button type="button" id="map-edit-regions" class="btn btn-secondary" hidden>Edit regions</button>
        <div id="map-status" class="map-status"></div>
        <div class="map-edit-actions" id="map-edit-actions">
          <button type="button" id="map-discard-regions" class="btn btn-secondary" hidden>Discard Changes</button>
          <button type="button" id="map-save-regions" class="btn btn-primary" hidden>Save Regions</button>
        </div>
      </div>

      <div id="map" class="map-canvas"></div>
    </main>
  </div>

  <!-- Topology modal — populated by map.js on marker click -->
  <div class="modal-overlay" id="topology-overlay" aria-hidden="true">
    <div class="modal modal-xl" role="dialog" aria-modal="true" aria-labelledby="topology-title">
      <div class="modal-header">
        <h3 id="topology-title">Site topology</h3>
        <div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end">
          <div class="topology-search-wrap" style="position:relative;flex:0 1 320px;max-width:320px">
            <input
              type="search"
              id="topology-search-input"
              class="topology-search-input"
              placeholder="Find endpoint by hostname / IP / MAC / user…"
              aria-label="Search endpoints in this site"
              autocomplete="off"
              spellcheck="false"
            >
            <ul id="topology-search-results" class="topology-search-results" role="listbox" hidden></ul>
          </div>
          <button type="button" class="btn" id="topology-show-full" hidden style="padding:4px 10px;font-size:12px">Show full site</button>
          <button type="button" class="btn-icon" id="topology-refresh" aria-label="Refresh topology" title="Refresh topology" style="line-height:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
          <button type="button" class="btn-icon" id="topology-legend" aria-label="Toggle legend" title="Toggle legend" style="line-height:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="2"/>
              <line x1="11" y1="6" x2="21" y2="6"/>
              <circle cx="6" cy="12" r="2"/>
              <line x1="11" y1="12" x2="21" y2="12"/>
              <circle cx="6" cy="18" r="2"/>
              <line x1="11" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <button type="button" class="btn-icon" id="topology-save-layout" aria-label="Save layout" title="Save this layout as a restore point" style="line-height:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
          </button>
          <button type="button" class="btn-icon" id="topology-reset-layout" aria-haspopup="menu" aria-expanded="false" aria-label="Reset layout" title="Reset layout" style="line-height:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </button>
          <button type="button" class="btn-icon" id="topology-fullscreen" aria-label="Toggle full screen" title="Toggle full screen (Esc to exit)" style="line-height:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
          <button type="button" class="btn-icon" id="topology-screenshot" aria-label="Copy entire view (map + details) as image" title="Copy entire view (map + details) as image" style="line-height:0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <button type="button" class="btn-icon modal-close" id="topology-close" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="topology-layout">
          <div id="topology-graph" class="topology-graph">
            <div id="topology-legend-overlay" class="topology-legend" hidden>
              <header class="topology-legend-header">
                <span class="topology-legend-title">Legend</span>
                <button type="button" class="btn-icon" id="topology-legend-close" aria-label="Close legend" title="Close">&times;</button>
              </header>
              <div id="topology-legend-body" class="topology-legend-body"></div>
            </div>
          </div>
          <aside id="topology-info" class="topology-info"></aside>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/vendor/leaflet/leaflet.js"></script>
  <script src="/js/vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="/js/vendor/leaflet/leaflet.draw.js"></script>
  <script src="/js/vendor/cytoscape.min.js"></script>
  <script src="/js/vendor/dagre.min.js"></script>
  <script src="/js/vendor/cytoscape-dagre.js"></script>
  <script src="/js/vendor/jspdf.umd.min.js"></script>
  <script src="/js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="/js/vendor/html-to-image.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/region-pills.js"></script>
  <script src="/js/region-tree.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <!-- assets.js + its UI deps power the canonical asset details slide-in
       (openViewModal) that the Device Map reuses for node click-through.
       Each file's DOMContentLoaded handler self-guards on its own page DOM,
       so loading them here doesn't kick off any Assets-page UI. jspdf IS
       included (above) — the panel's Events-tab Export button generates the
       same PDF as the Events page, so the slide-in needs it here too. -->
  <script src="/js/table-sf.js"></script>
  <script src="/js/favorites.js"></script>
  <script src="/js/integrations.js"></script>
  <script src="/js/temp-unit.js"></script>
  <script src="/js/chart-severity.js"></script>
  <script src="/js/monitor-states.js"></script>
  <script src="/js/assets.js"></script>
  <!-- Asset modal Alerts tab: the Trigger summary + click-a-name-to-edit open the
       automation wizard in place. Standalone — it owns its builder catalogs, so
       automations.js is not needed here. -->
  <script src="/js/condition-builder.js"></script>
  <script src="/js/automations-address-book.js"></script>
  <script src="/js/automations-wizard.js"></script>
  <script src="/js/automations-portability.js"></script>
  <!-- Asset modal's Maintenance tab (ad-hoc "enter maintenance until…") needs
       maintCreateAdhoc; the Maintenance MODAL itself is wired on assets.html only. -->
  <script src="/js/recurrence-editor.js"></script>
  <script src="/js/assets-maintenance.js"></script>
  <script src="/js/topology-render.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
