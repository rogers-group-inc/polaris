<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Leaflet + markercluster for the siteMap dashboard widget. -->
  <link rel="stylesheet" href="/css/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="/css/vendor/leaflet/MarkerCluster.Default.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header page-header-sticky">
        <h2>Dashboard</h2>
        <div class="page-header-actions">
          <!-- Saved dashboards (dashboard-saved.js): name this canvas, keep it
               private or publish it, load anyone's published one back. The menu
               body is rendered from the server list on every open. -->
          <div class="btn-dropdown-wrap">
            <button type="button" class="btn btn-secondary" id="btn-saved-dashboards" title="Save, load and manage named dashboards">Dashboards &#9662;</button>
            <div class="btn-dropdown-menu sfl-menu" id="saved-dashboards-menu"></div>
          </div>
          <button type="button" id="dashboard-customize" class="btn btn-primary">Customize Page</button>
          <button type="button" id="dashboard-add-widgets" class="btn btn-primary" hidden>Add Widgets</button>
          <button type="button" id="dashboard-done" class="btn btn-secondary" hidden>Done Editing</button>
          <button type="button" id="dashboard-create" class="btn btn-secondary">Create New Dashboard</button>
        </div>
      </div>

      <div id="dashboard-tabs" class="dashboard-tabs" hidden></div>
      <div id="dashboard-empty-state" class="dashboard-empty">
        Click <strong>Customize Page</strong>, then <strong>Add Widgets</strong>, to build your dashboard.
      </div>
      <div id="dashboard-canvas" class="dashboard-canvas" hidden></div>
    </main>
  </div>

  <!-- Add-Widgets picker: translucent overlay (dashboard shows through) docking
       a Group-By list + searchable/sortable/favoritable widget list. -->
  <div class="widget-picker-overlay" id="widget-library-overlay" aria-hidden="true">
    <div class="widget-picker" role="dialog" aria-labelledby="widget-picker-title">
      <div class="widget-picker-header">
        <h3 id="widget-picker-title">Add Widgets</h3>
        <button type="button" class="btn btn-icon" id="widget-library-close" aria-label="Close">&times;</button>
      </div>
      <div class="widget-picker-toolbar">
        <input type="search" id="widget-picker-search" placeholder="Search widgets…" aria-label="Search widgets">
        <select id="widget-picker-sort" aria-label="Sort widgets">
          <option value="name-asc">Name (A–Z)</option>
          <option value="name-desc">Name (Z–A)</option>
        </select>
      </div>
      <div class="widget-picker-body">
        <ul class="widget-picker-groups" id="widget-picker-groups"></ul>
        <div class="widget-picker-list" id="widget-library-body"></div>
      </div>
    </div>
  </div>

  <script src="/js/vendor/leaflet/leaflet.js"></script>
  <script src="/js/vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <!-- Canonical asset-details slide-in (openViewModal in assets.js), reused
       in-place by the Down Assets widget. Same dependency set map.html loads to
       reuse the same component; assets.js + integrations.js guard their
       page-init so they stay inert off their own pages (no #assets-tbody here). -->
  <script src="/js/vendor/jspdf.umd.min.js"></script>
  <script src="/js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="/js/vendor/html-to-image.min.js"></script>
  <script src="/js/table-sf.js"></script>
  <script src="/js/integrations.js"></script>
  <script src="/js/temp-unit.js"></script>
  <script src="/js/chart-severity.js"></script>
  <script src="/js/monitor-states.js"></script>
  <script src="/js/assets.js"></script>
  <!-- Asset modal Alerts tab: the Trigger summary + click-a-name-to-edit open the
       automation wizard in place. Standalone — it owns its builder catalogs, so
       automations.js is not needed here. -->
  <script src="/js/condition-builder.js"></script>
  <script src="/js/automations-address-book.js"></script>
  <script src="/js/automations-wizard.js"></script>
  <script src="/js/automations-portability.js"></script>
  <!-- Asset modal's Maintenance tab (ad-hoc "enter maintenance until…") needs
       maintCreateAdhoc; the Maintenance MODAL itself is wired on assets.html only. -->
  <script src="/js/recurrence-editor.js"></script>
  <script src="/js/assets-maintenance.js"></script>
  <!-- Widget script list below is mirrored by dash.html (the unauthenticated
       Dash wallboard) — keep the two lists in lockstep when adding widgets. -->
  <!-- The acknowledge card's markup + the modal the Down Assets widget opens
       with it. Shared with /alert-ack.html, which loads the view module too. -->
  <script src="/js/alert-ack-view.js"></script>
  <script src="/js/alert-ack-modal.js"></script>
  <script src="/js/widgets/index.js"></script>
  <!-- Shared helper before its consumers. -->
  <script src="/js/widgets/_topnBar.js"></script>
  <!-- IPAM / system widgets. -->
  <script src="/js/widgets/recentReservations.js"></script>
  <script src="/js/widgets/assetTypes.js"></script>
  <script src="/js/widgets/blockUtilization.js"></script>
  <script src="/js/widgets/staleReservations.js"></script>
  <script src="/js/widgets/capacityHealth.js"></script>
  <script src="/js/widgets/discoveryActivity.js"></script>
  <script src="/js/widgets/conflictQueue.js"></script>
  <!-- NOC widgets. -->
  <script src="/js/widgets/statusSummary.js"></script>
  <script src="/js/widgets/downNodes.js"></script>
  <script src="/js/widgets/downInterfaces.js"></script>
  <script src="/js/widgets/topCpu.js"></script>
  <script src="/js/widgets/topMemory.js"></script>
  <script src="/js/widgets/slowestResponse.js"></script>
  <script src="/js/widgets/packetLoss.js"></script>
  <script src="/js/widgets/diskUsage.js"></script>
  <script src="/js/widgets/storageForecast.js"></script>
  <script src="/js/widgets/temperature.js"></script>
  <script src="/js/widgets/stalePolls.js"></script>
  <script src="/js/widgets/recentReboots.js"></script>
  <script src="/js/widgets/activeAlerts.js"></script>
  <script src="/js/widgets/sitesWithIssues.js"></script>
  <script src="/js/widgets/siteMap.js"></script>
  <script src="/js/widgets/deviceMap.js"></script>
  <script src="/js/favorites.js"></script>
  <script src="/js/widget-library.js"></script>
  <script src="/js/dashboard.js"></script>
  <!-- After dashboard.js: it reads window.PolarisSavedDashboards at bootstrap,
       which is published at parse time, so either order works — this one
       matches assets.html (assets-filters.js after assets.js). -->
  <script src="/js/dashboard-saved.js"></script>
</body>
</html>
