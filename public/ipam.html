<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris — IPAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header">
        <h2>IPAM</h2>
        <!-- Export lives in the always-present top header (not inside a tab
             template) so it works for BOTH the IP Blocks and Networks tabs and
             stays wired regardless of which tab is mounted. ipam.js wires the
             button once and dispatches to the active tab's export(). The user
             badge (rendered by app.js renderUserBadge) is appended into this
             same .page-header-actions afterwards, so Export sits to its left. -->
        <div class="page-header-actions">
          <div class="btn-dropdown-wrap">
            <button class="btn btn-secondary" id="btn-export">Export &#9662;</button>
            <div class="btn-dropdown-menu" id="export-menu">
              <div class="dropdown-heading">PDF</div>
              <button data-export="page" data-fmt="pdf">Current page</button>
              <button data-export="filtered" data-fmt="pdf">All filtered results</button>
              <button data-export="all" data-fmt="pdf" class="export-all-label">Entire network list</button>
              <div class="dropdown-divider"></div>
              <div class="dropdown-heading">CSV</div>
              <button data-export="page" data-fmt="csv">Current page</button>
              <button data-export="filtered" data-fmt="csv">All filtered results</button>
              <button data-export="all" data-fmt="csv" class="export-all-label">Entire network list</button>
            </div>
          </div>
        </div>
      </div>

      <div class="page-tabs" id="ipam-tabs">
        <button class="page-tab" data-tab="blocks">IP Blocks</button>
        <button class="page-tab active" data-tab="networks">Networks</button>
      </div>

      <!--
        IPAM mount: the orchestrator (ipam.js) clones one of the two templates
        below into this <div> when the user activates a tab, and replaces it
        when switching tabs. The IDs inside each template (filter-pagesize,
        pagination, *-tbody, etc.) collide between Blocks and Networks, so
        only ONE tab's markup is in the DOM at a time.
      -->
      <div id="ipam-mount"></div>

      <template id="ipam-tpl-blocks">
        <div class="page-header" style="margin-top:0">
          <div></div>
          <div class="page-header-actions">
            <button class="btn btn-primary" id="btn-add-block" data-manage-networks>+ Add Block</button>
          </div>
        </div>

        <div id="pagination-top" style="display:flex;align-items:center;gap:12px;justify-content:center;padding:0.5rem 0 1rem"></div>

        <div class="table-wrapper table-wrapper-sticky">
          <table>
            <thead>
              <tr>
                <th class="fav-col" title="Favorites pin to the top"></th>
                <th data-sf-key="name" data-sf-type="string">Name</th>
                <th style="width:170px" data-col-no-resize="true" data-sf-key="cidr" data-sf-type="ip">CIDR</th>
                <th style="width:100px" data-col-no-resize="true" data-sf-key="ipVersion" data-sf-type="string" data-sf-options="v4=IPv4|v6=IPv6">Version</th>
                <th data-sf-key="description" data-sf-type="string">Description</th>
                <th data-sf-key="tags" data-sf-type="array">Tags</th>
                <th style="width:110px" data-col-no-resize="true" data-sf-key="_count.subnets" data-sf-type="number">Networks</th>
                <th style="width:130px" data-col-no-resize="true" data-sf-key="createdAt" data-sf-type="date">Created</th>
              </tr>
            </thead>
            <tbody id="blocks-tbody">
              <tr><td colspan="8" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination" style="display:flex;align-items:center;gap:12px;justify-content:center;padding:1rem 0"></div>
      </template>

      <template id="ipam-tpl-networks">
        <div class="page-header" style="margin-top:0">
          <div></div>
          <div class="page-header-actions">
            <button class="btn btn-secondary" id="btn-exclusions">Exclusions</button>
            <button class="btn btn-secondary" id="btn-auto-alloc" data-create-networks>Auto-Allocate Next</button>
            <button class="btn btn-primary" id="btn-add-subnet" data-create-networks>+ Add Network</button>
          </div>
        </div>

        <div id="pagination-top" style="display:flex;align-items:center;gap:12px;justify-content:center;padding:0.5rem 0 1rem"></div>

        <div class="table-wrapper table-wrapper-sticky">
          <table>
            <thead>
              <tr>
                <th class="fav-col" title="Favorites pin to the top"></th>
                <th data-sf-key="name" data-sf-type="string">Name</th>
                <th data-sf-key="cidr" data-sf-type="ip">Network</th>
                <th data-sf-key="block.name" data-sf-type="string" data-sf-options="">Block</th>
                <th data-sf-key="purpose" data-sf-type="string">Purpose</th>
                <th style="width:90px"  data-col-no-resize="true" data-sf-key="vlan" data-sf-type="number">VLAN</th>
                <th style="width:120px" data-col-no-resize="true" data-sf-key="status" data-sf-type="string" data-sf-options="available|reserved|deprecated">Status</th>
                <th data-sf-key="tags" data-sf-type="array">Tags</th>
                <!-- "Sources" matches the assets page's column of the same name.
                     data-sf-key stays `fortigateDevice` so saved column layouts
                     and filter presets keep working across the rename. -->
                <th data-sf-key="fortigateDevice" data-sf-type="string">Sources</th>
                <th data-sf-key="_integration" data-sf-type="string" data-sf-options="">Integration</th>
                <th data-sf-key="createdBy" data-sf-type="string" data-sf-options="">Creator</th>
                <th style="width:120px" data-col-no-resize="true" data-sf-key="_count.reservations" data-sf-type="number">Reservations</th>
              </tr>
            </thead>
            <tbody id="subnets-tbody">
              <tr><td colspan="12" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination" style="display:flex;align-items:center;gap:12px;justify-content:center;padding:1rem 0"></div>
      </template>
    </main>
  </div>

  <!-- IPAM tab orchestrator: ipam-tabs-flag.js sets window.__polarisIpamTabs
       BEFORE blocks.js + subnets.js load so they skip their legacy DOMContentLoaded
       auto-init (each checks the flag) and let ipam.js drive init on tab switch.
       Externalized from an inline <script> for CSP `script-src 'self'` compatibility. -->
  <script src="/js/vendor/jspdf.umd.min.js"></script>
  <script src="/js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/password-self.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/passkeys-self.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/table-sf.js"></script>
  <script src="/js/favorites.js"></script>
  <script src="/js/block-panel.js"></script>
  <script src="/js/placeholder-mac.js"></script>
  <script src="/js/ip-panel.js"></script>
  <script src="/js/ipam-tabs-flag.js"></script>
  <script src="/js/blocks.js"></script>
  <script src="/js/subnets.js"></script>
  <script src="/js/ipam.js"></script>
</body>
</html>
