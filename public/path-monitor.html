<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris — Path Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <script src="/js/theme-init.js"></script>
  <link rel="expect" href="#polaris-nav-ready" blocking="render">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/page-transitions.css">
  <link rel="stylesheet" href="/css/assistant.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="path-page">
      <div class="page-header">
        <h2>Path Monitor</h2>
        <div class="page-header-actions"></div>
      </div>

      <!-- Path checks (path-checks.js). Gated by the
           pathChecks key: read = the list + Results, write = the verbs.
           A check says WHAT to measure and FROM where (this server and/or
           agent hosts); SLAs are set
           by automations on its path* metrics (business rule 85). -->
      <!-- A tab row with no tabs: inside a .table-head-row the -top row drops its
           page numbers (they are below the card) and carries Refresh / Clear
           Filters / Show N on the right, as on the tabbed list pages. -->
      <div class="table-head-row folder-head-card">
        <!-- The page's action buttons, moved from the header into the tab
             row, left of the list controls. -->
        <div class="table-head-controls">
          <!-- The Assets page's Maintenance button, for path checks (business
               rule 135): same modal, path-check mode. It stays here; + Add
               Monitor moves into the right cluster, as + Add Asset(s) does. -->
          <button class="btn btn-secondary" id="btn-maintenance" data-maintenance-mgmt title="Maintenance schedules — pause path checks and their alerts">Maintenance</button>
          <button class="btn btn-primary" id="btn-add-check" style="display:none">+ Add Monitor</button>
        </div>
        <div id="path-pagination-top" class="table-head-controls"></div>
      </div>
      <!-- Folder card (styles.css "Folder CARD"): the table fills it down to
           the page navigation below it and scrolls inside. -->
      <div class="folder-card folder-body">
      <div class="table-wrapper table-wrapper-sticky">
        <table>
          <thead>
            <tr>
              <th style="width:200px" data-col-id="name" data-sf-key="name" data-sf-type="string">Name</th>
              <th style="width:80px" data-col-no-resize="true" data-col-id="kind" data-sf-key="kind" data-sf-type="string" data-sf-options="http|https|tcp|icmp">Kind</th>
              <th style="width:260px" data-col-id="target" data-sf-key="target" data-sf-type="string">Target</th>
              <th style="width:110px" data-col-no-resize="true" data-col-id="interval" data-sf-key="intervalSec" data-sf-type="number" data-sf-nofilter="true">Interval</th>
              <th style="width:110px" data-col-no-resize="true" data-col-id="sources" data-sf-key="sourceCount" data-sf-type="number" data-sf-nofilter="true">Sources</th>
              <th style="width:170px" data-col-id="result" data-sf-key="failCount" data-sf-type="number" data-sf-nofilter="true">Result</th>
              <th style="width:150px" data-col-id="lastRun" data-sf-key="lastRunAt" data-sf-type="date">Last run</th>
              <th style="width:130px" data-col-no-resize="true" data-col-id="traceroute" data-sf-key="tracerouteEnabled" data-sf-type="string" data-sf-options="true=On|false=Off">Traceroute</th>
              <th style="width:110px" data-col-no-resize="true" data-col-id="enabled" data-sf-key="enabled" data-sf-type="string" data-sf-options="true=Enabled|false=Disabled">Enabled</th>
              <th style="width:170px" data-col-id="maintenance" data-sf-key="maintenanceState" data-sf-type="string" data-sf-options="maintenance=In maintenance|none=Not in maintenance">Maintenance</th>
              <th data-col-id="createdBy" data-sf-key="createdBy" data-sf-type="string">Created by</th>
            </tr>
          </thead>
          <tbody id="path-tbody">
            <tr><td colspan="11" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      </div>
      <!-- Page navigation sits below the card. -->
      <div class="pagination folder-card-nav" id="path-pagination" style="display:flex;align-items:center;gap:12px;justify-content:center"></div>
    </main>
  </div>

  <!-- assets.js + its UI deps power the canonical asset details slide-in
       (openViewModal) the Results view opens on a host's Paths tab —
       the same stack appmap.html loads. Each file's page-init self-guards on
       its own page DOM. -->
  <script src="/js/vendor/jspdf.umd.min.js"></script>
  <script src="/js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="/js/vendor/html-to-image.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/assistant-markdown.js"></script>
  <script src="/js/assistant.js"></script>
  <script src="/js/folder-tabs.js"></script>
  <script src="/js/panel-lock.js"></script>
  <script src="/js/app.js"></script>
  <span id="polaris-nav-ready" hidden></span>
  <script src="/js/table-sf.js"></script>
  <script src="/js/favorites.js"></script>
  <script src="/js/monitor-states.js"></script>
  <script src="/js/monitor-down-after.js"></script>
  <script src="/js/polling-methods.js"></script>
  <script src="/js/integrations.js"></script>
  <script src="/js/temp-unit.js"></script>
  <script src="/js/chart-severity.js"></script>
  <script src="/js/assets.js"></script>
  <script src="/js/recurrence-editor.js"></script>
  <script src="/js/quiet-time-editor.js"></script>
  <script src="/js/assets-maintenance.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/password-self.js"></script>
  <script src="/js/totp-self.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/passkeys-self.js"></script>
  <script src="/js/condition-builder.js"></script>
  <script src="/js/automations-address-book.js"></script>
  <script src="/js/automations-wizard.js"></script>
  <script src="/js/automations-portability.js"></script>
  <script src="/js/path-checks.js"></script>
</body>
</html>
