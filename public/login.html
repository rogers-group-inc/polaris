<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-light.png">
  <link rel="icon" type="image/png" href="/img/brand/polaris-symbol-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem 0;
      background: var(--color-bg-secondary);
    }
    /* On-screen-keyboard mode (mobile). iOS Safari does not resize the layout
       viewport when the keyboard opens, so 100vh/100dvh still measure the whole
       screen and the flex-centered card stays put — with the password field and
       Sign in button behind the keyboard. login.js watches window.visualViewport
       and flips this class on while the keyboard is up: the wrapper is pinned to
       the *visible* rect (--vv-height / --vv-offset-top) and top-aligns its card,
       scrolling internally when the card is taller than what's left. */
    .login-wrapper.kb-open {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      min-height: 0;
      height: var(--vv-height, 100dvh);
      transform: translateY(var(--vv-offset-top, 0px));
      align-items: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .login-card {
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow-md);
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .login-card .subtitle {
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.5px;
    }
    .login-error {
      background: rgba(255,23,68,0.12);
      color: var(--color-danger);
      border: 1px solid rgba(255,23,68,0.3);
      border-radius: var(--radius-md);
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .login-card .btn-primary { width: 100%; justify-content: center; }
    /* Push the submit button down so its gap from the password field matches
       the username→password gap (which also includes the password label:
       0.8rem × 1.5 line-height + 4px label margin). */
    #login-form .btn-primary { margin-top: calc(0.8rem * 1.5 + 4px); }
    .login-logo {
      display: block;
      margin: 0 auto 1rem;
      max-width: 160px;
      border-radius: 8px;
    }
    /* The shipped Polaris art is a horizontal wordmark, so it wants the card's
       width rather than a square logo's box — and no rounded corners, since
       it's transparent artwork rather than an uploaded tile. */
    .login-logo.brand-mark {
      max-width: 240px;
      width: 100%;
      border-radius: 0;
      margin-bottom: 1.25rem;
    }
    .login-divider {
      display: flex;
      align-items: center;
      margin: 1.25rem 0;
      color: var(--color-text-tertiary);
      font-size: 0.8rem;
    }
    .login-divider::before, .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .login-divider span { padding: 0 0.75rem; }
    .btn-sso {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-sso:hover {
      background: var(--color-bg-tertiary, var(--color-bg-secondary));
      border-color: var(--color-text-tertiary);
    }
    .btn-sso svg { width: 18px; height: 18px; flex-shrink: 0; }
    #sso-section { display: none; }
    .login-redirect-msg {
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: 0.85rem;
      margin-top: 1rem;
    }
    .login-redirect-msg a { color: var(--color-primary, #4a9eff); }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <img src="/img/brand/polaris-horiz-dark.png" alt="" class="login-logo brand-mark brand-mark-login" style="visibility:hidden">
      <h2 style="visibility:hidden;display:none">Polaris</h2>
      <p class="subtitle" style="visibility:hidden">Network Management Tool</p>
      <div class="login-error" id="login-error"></div>
      <div id="local-login-section">
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
        <!-- Passkey sign-in. Hidden until GET /auth/passkeys/config says the
             install allows it AND this browser is in a secure context — on a
             plain-HTTP lab install the button would only ever produce a
             SecurityError, so it is never drawn there. -->
        <div id="passkey-section" style="display:none">
          <div class="login-divider"><span>or</span></div>
          <button id="btn-passkey" class="btn-sso" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><circle cx="9" cy="9" r="4"/><path d="M14.5 11.5L21 18v3h-3l-1-1h-2l-1-1v-2l-1-1"/></svg>
            Sign in with a passkey
          </button>
        </div>
      </div>
      <div id="sso-section">
        <div class="login-divider"><span>or</span></div>
        <button id="btn-sso" class="btn-sso" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 2L3 7v5c0 5.25 3.75 10.14 9 11.4 5.25-1.26 9-6.15 9-11.4V7l-9-5z"/></svg>
          Sign in with SSO
        </button>
        <button id="btn-oidc" class="btn-sso" style="display:none;margin-top:0.5rem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M12 2L3 7v5c0 5.25 3.75 10.14 9 11.4 5.25-1.26 9-6.15 9-11.4V7l-9-5z"/></svg>
          Sign in with OpenID Connect
        </button>
        <button id="btn-entra-proxy" class="btn-sso" style="display:none;margin-top:0.5rem">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px"><rect x="2" y="2" width="9" height="9" fill="#f25022"/><rect x="13" y="2" width="9" height="9" fill="#7fba00"/><rect x="2" y="13" width="9" height="9" fill="#00a4ef"/><rect x="13" y="13" width="9" height="9" fill="#ffb900"/></svg>
          Sign in with App Proxy
        </button>
      </div>
      <div id="demo-setup-section" style="display:none">
        <div class="login-divider"><span>demo</span></div>
        <button id="btn-demo-setup" class="btn-sso" style="color:var(--color-text-secondary)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          View Setup Wizard
        </button>
      </div>
      <div id="mfa-section" style="display:none">
        <!-- The second factor. Which halves are shown depends on what the
             account actually has: the code form for TOTP, the button for a
             passkey, both (with links between them) when the account has
             enrolled both. -->
        <form id="mfa-form">
          <div class="form-group">
            <label for="mfa-code" id="mfa-code-label">Verification code</label>
            <input type="text" id="mfa-code" name="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" data-mode="totp" required autofocus>
            <p class="hint" id="mfa-hint">Enter the 6-digit code from your authenticator app.</p>
          </div>
          <button type="submit" class="btn btn-primary">Verify</button>
          <p style="text-align:center;margin-top:0.75rem;font-size:0.8rem">
            <a href="#" id="btn-use-backup" style="color:var(--color-primary,#4a9eff)">Use a backup code</a>
          </p>
        </form>
        <div id="mfa-passkey-block" style="display:none">
          <p class="hint" id="mfa-passkey-hint" style="text-align:center;margin-bottom:0.75rem">Confirm it's you with your passkey.</p>
          <button id="btn-mfa-passkey" class="btn btn-primary" type="button" style="width:100%">Use your passkey</button>
        </div>
        <p id="mfa-switch" style="text-align:center;margin-top:0.75rem;font-size:0.8rem;display:none">
          <a href="#" id="btn-mfa-switch" style="color:var(--color-primary,#4a9eff)">Use a passkey instead</a>
        </p>
      </div>
      <!-- Forced password change. Reached only after EVERY factor has passed,
           when the operator has asked for passwords that no longer meet the
           complexity policy to be replaced at login. -->
      <div id="pwchange-section" style="display:none">
        <form id="pwchange-form">
          <p class="hint" style="margin-bottom:1rem">Your password no longer meets this system's complexity requirements. Set a new one to continue.</p>
          <div class="form-group">
            <label for="pw-new">New password</label>
            <input type="password" id="pw-new" autocomplete="new-password" required>
            <div id="pw-new-checks" style="margin-top:0.4rem;font-size:0.8rem;line-height:1.6;color:var(--color-text-tertiary)"></div>
          </div>
          <div class="form-group">
            <label for="pw-confirm">Confirm new password</label>
            <input type="password" id="pw-confirm" autocomplete="new-password" required>
            <div id="pw-confirm-match" style="margin-top:0.4rem;font-size:0.8rem;line-height:1.6;color:var(--color-text-tertiary)"></div>
          </div>
          <button type="submit" class="btn btn-primary">Set password and sign in</button>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/brand-logo.js"></script>
  <script src="/js/webauthn.js"></script>
  <script src="/js/auth-flow.js"></script>
  <script src="/js/password-self.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
