<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polaris UI</title>
<style>
  html, body { margin: 0; padding: 0; height: auto; background: transparent; overflow: visible; }
  .cv { display: block; }
  .cv-ground { fill: var(--color-bg-secondary); }
  .cv-accent { fill: var(--color-accent); }
  .cv-ink    { fill: var(--color-text-primary); }
  .cv-mid    { fill: var(--color-text-secondary); }
  .cv-relief { fill: var(--color-success); }
  .pip       { fill: var(--color-accent); rx: var(--radius-sm); }
  .cv-block  { rx: var(--radius-lg); }
  .cv-name   { fill: var(--color-text-primary); font-family: var(--font-sans); font-size: 72px; font-weight: 700; letter-spacing: -1px; }
  .cv-tag    { fill: var(--color-text-secondary); font-family: var(--font-sans); font-size: 13px; font-weight: 400; }
</style>
</head>
<body>
<!-- Derivation
     blocks: --color-accent 176x228 and --color-text-primary 112x120 and
       --color-text-secondary 160x188, all rx --radius-lg, with a --color-success
       44x44 chip for relief; the ground is --color-bg-secondary.
     arrangement: one tall accent slab bleeding off the top edge with two ink
       satellites flush to the top and bleeding off the right — the top-weighted
       chrome of the app shell, not a row of equal swatches.
     pattern: tiles cut by the radius tokens, some merged two-wide, because the
       centrepiece of Polaris is an address and asset map where contiguous
       reservations merge into runs; drawn at --radius-sm in --color-accent.
     scales: pitch 16px (4x the 4px step), tile 12px, merged tile 28px, block
       gaps 16px, radii --radius-sm 4px and --radius-lg 12px.
-->

  <rect class="cv-ground" x="0" y="0" width="960" height="288"/>
