<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  /* Preview frame only, not part of the component. The phone sheet locks html/body to the
     viewport; that is undone here; .pv-stage contains the
     fixed-position parts (sheet, scrim, snackbar, topology screen) inside a box. Glyphs are
     plain stand-ins: the app's own icons are drawn in its JavaScript and did not come across. */
  html, body { height: auto !important; overflow: visible !important; }
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .pv-cap { font-size: 12px; letter-spacing: .4px; color: var(--md-on-surface-variant); margin: 0 0 8px; }
  .pv-stage { position: relative; transform: translateZ(0); overflow: hidden; background: var(--md-surface);
              border: 1px solid var(--md-outline-variant); border-radius: var(--shape-md); margin-bottom: 16px; }
  .pv-stage .app { display: flex !important; }
  .pv-stage .sheet, .pv-stage .scrim { display: block !important; }
  .pv-stage .snackbar, .pv-stage .topo-screen { display: flex !important; }
</style>
</head>
<body>
<div class="pv-stage" style="height:700px">
<div class="app" data-tab="">
  <div class="login-shell">
    <div class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4.5a2.5 2.5 0 1 1 0 5a2.5 2.5 0 1 1 0-5z"/></svg></div>
    <h2>Polaris</h2>
    <div class="sub">Sign in to continue</div>
    <div class="tf-outlined full-field"><input class="field" value="operator"><label class="lbl">Username</label></div>
    <div class="tf-outlined full-field"><input class="field" type="password" value="password"><label class="lbl">Password</label></div>
    <button class="btn btn-filled btn-block">Sign in</button>
    <div class="divider">or</div>
    <button class="btn btn-outlined btn-block">Use single sign-on</button>
  </div>
</div>
</div>
</body>
</html>
