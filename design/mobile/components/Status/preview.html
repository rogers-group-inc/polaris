<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Status</title>
<style>
  /* Preview frame only, not part of the component. The phone sheet locks html/body to the
     viewport and, in any landscape viewport under 480px tall (which a preview card is),
     hides the app and paints a rotate prompt. Both are undone here; .pv-stage contains the
     fixed-position parts (sheet, scrim, snackbar, topology screen) inside a box. Glyphs are
     plain stand-ins: the app's own icons are drawn in its JavaScript and did not come across. */
  body::before { content: none !important; display: none !important; }
  html, body { height: auto !important; overflow: visible !important; }
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .pv-cap { font-size: 12px; letter-spacing: .4px; color: var(--md-on-surface-variant); margin: 0 0 8px; }
  .pv-stage { position: relative; transform: translateZ(0); overflow: hidden; background: var(--md-surface);
              border: 1px solid var(--md-outline-variant); border-radius: var(--shape-md); margin-bottom: 16px; }
  .pv-stage .app { display: flex !important; }
  .pv-stage .sheet, .pv-stage .scrim { display: block !important; }
  .pv-stage .snackbar, .pv-stage .topo-screen { display: flex !important; }
</style>
</head>
<body>
<p class="pv-cap">Status pills</p>
<div class="pv-row">
  <span class="status-pill up"><span class="dot up"></span>Up</span>
  <span class="status-pill warn"><span class="dot warn"></span>Degraded</span>
  <span class="status-pill down"><span class="dot down"></span>Down</span>
  <span class="status-pill unk"><span class="dot unk"></span>Unknown</span>
</div>
<div class="pv-row">
  <span class="status-pill dep-down"><span class="dot dep-down"></span>Dependency down</span>
  <span class="status-pill maint"><span class="dot maint"></span>Maintenance</span>
  <span class="status-pill passive"><span class="dot passive"></span>Passive</span>
</div>
<p class="pv-cap">Dots</p>
<div class="pv-row"><span class="dot up"></span><span class="dot warn"></span><span class="dot down"></span><span class="dot unk"></span><span class="dot dep-down"></span><span class="dot maint"></span><span class="dot passive"></span></div>
</body>
</html>
