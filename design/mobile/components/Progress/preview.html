<!-- @dsCard group="Feedback" page height=420 width=390 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Progress</title>
<style>
  /* Preview frame only, not part of the component. The phone sheet locks html/body to the
     viewport and, in any landscape viewport under 480px tall (which a preview card is),
     hides the app and paints a rotate prompt. Both are undone here; .pv-stage contains the
     fixed-position parts (sheet, scrim, snackbar, topology screen) inside a box. Glyphs are
     plain stand-ins: the app's own icons are drawn in its JavaScript and did not come across. */
  body::before { content: none !important; display: none !important; }
  html, body { height: auto !important; overflow: visible !important; }
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .pv-cap { font-size: 12px; letter-spacing: .4px; color: var(--md-on-surface-variant); margin: 0 0 8px; }
  .pv-stage { position: relative; transform: translateZ(0); overflow: hidden; background: var(--md-surface);
              border: 1px solid var(--md-outline-variant); border-radius: var(--shape-md); margin-bottom: 16px; }
  .pv-stage .app { display: flex !important; }
  .pv-stage .sheet, .pv-stage .scrim { display: block !important; }
  .pv-stage .snackbar, .pv-stage .topo-screen { display: flex !important; }
</style>
</head>
<body>
<p class="pv-cap">Spinner</p>
<div class="pv-row"><div class="spinner"></div></div>
<p class="pv-cap">Loading screen</p>
<div class="pv-stage" style="display:flex;height:140px"><div class="loading-screen"><div class="spinner"></div></div></div>
<p class="pv-cap">Pull to refresh — pulling, ready, refreshing</p>
<div class="pv-row">
  <div style="position:relative;width:72px;height:64px"><div class="ptr-indicator" style="opacity:1;transform:none"><div class="ptr-circle"><svg class="ptr-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M11 4h2v11.2l4.6-4.6L19 12l-7 7-7-7 1.4-1.4 4.6 4.6z"/></svg></div></div></div>
  <div style="position:relative;width:72px;height:64px"><div class="ptr-indicator ready" style="opacity:1;transform:none"><div class="ptr-circle"><svg class="ptr-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M11 4h2v11.2l4.6-4.6L19 12l-7 7-7-7 1.4-1.4 4.6 4.6z"/></svg></div></div></div>
  <div style="position:relative;width:72px;height:64px"><div class="ptr-indicator refreshing" style="opacity:1;transform:none"><div class="ptr-circle"><svg class="ptr-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></div></div></div>
</div>
</body>
</html>
