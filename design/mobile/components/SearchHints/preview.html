<!-- @dsCard group="Input" page height=300 width=390 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search hints</title>
<style>
  /* Preview frame only, not part of the component. The phone sheet locks html/body to the
     viewport; that is undone here; .pv-stage contains the
     fixed-position parts (sheet, scrim, snackbar, topology screen) inside a box. Glyphs are
     plain stand-ins: the app's own icons are drawn in its JavaScript and did not come across. */
  html, body { height: auto !important; overflow: visible !important; }
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  .pv-cap { font-size: 12px; letter-spacing: .4px; color: var(--md-on-surface-variant); margin: 0 0 8px; }
  .pv-stage { position: relative; transform: translateZ(0); overflow: hidden; background: var(--md-surface);
              border: 1px solid var(--md-outline-variant); border-radius: var(--shape-md); margin-bottom: 16px; }
  .pv-stage .app { display: flex !important; }
  .pv-stage .sheet, .pv-stage .scrim { display: block !important; }
  .pv-stage .snackbar, .pv-stage .topo-screen { display: flex !important; }
</style>
</head>
<body>
<div class="search-hint-section">
  <div class="search-hint-section-label">Search by</div>
  <div class="search-hint-grid">
    <button class="search-hint-chip"><span class="search-hint-keys"><span class="search-hint-key">192.0.2.11</span></span><span class="search-hint-label">Address</span></button>
    <button class="search-hint-chip"><span class="search-hint-keys"><span class="search-hint-key">core-sw</span></span><span class="search-hint-label">Name</span></button>
    <button class="search-hint-chip"><span class="search-hint-keys"><span class="search-hint-key">00:1a:2b</span><span class="search-hint-or">or</span><span class="search-hint-key">001a.2b</span></span><span class="search-hint-label">MAC address</span></button>
    <button class="search-hint-chip"><span class="search-hint-keys"><span class="search-hint-key">FOC21</span></span><span class="search-hint-label">Serial number</span></button>
  </div>
  <div class="search-hint-foot">Tap an example to try it.</div>
</div>
</body>
</html>
