name: Check docs

# Structural doc-drift guard for the project memory (CLAUDE.md + every Markdown
# file under .claude/skills/**). Enforces coverage + reference hygiene even when a
# local clone hasn't activated the pre-commit hook. design/ is deliberately out of scope — it is a drop-in
# snapshot of the external UI kit, not a doc this repo maintains.
# Pure file reads — no DB, no npm install, no prisma generate needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Structural doc-drift check
        run: node scripts/check-docs.mjs
