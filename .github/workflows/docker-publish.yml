name: Build and publish Polaris image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A push that touches ONLY these neither changes the image nor anything the
    # test jobs read, so it builds nothing. Kept deliberately narrow: docs/ stays
    # (docs/wiki is COPYed into the image, and rootHelperHintsFullPath scans
    # docs/ + README.md), and so does deploy/ (the unit suite reads its
    # scripts). GitHub evaluates path filters against the whole push, so any
    # code file in the range still builds; tag pushes ignore path filters.
    paths-ignore:
      - ".claude/**"
      - ".design-sync/**"
      - "design/**"
      - "plugin-candidates/**"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "DEVELOPMENT.md"
      - ".github/workflows/check-docs.yml"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Default to read-only; the build job widens its own permissions for the
# GHCR push + attestation.
permissions:
  contents: read

# Every `uses:` below is pinned to an immutable commit SHA with the version in
# a trailing comment, not to a tag. A tag is mutable: whoever controls an
# action's repository can re-point v4 at new code, and this workflow hands the
# build job `packages: write` + `id-token: write` — enough to publish a signed
# image under our own name. Dependabot updates SHA pins and their comments
# natively, so this costs nothing to keep current.
#
# Concurrency is per JOB, not per workflow, so a newer push to the same ref
# cancels an older run's tests but never an older run's build mid-publish: a
# build killed between "Build and push" and the attestation leaves a pushed
# image with no provenance. The build group queues instead (cancel-in-progress
# false), and a still-pending older build is replaced by the newer one, so
# `latest` can't be overwritten by a stale commit finishing last.
jobs:
  test:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          # prisma.config.ts resolves env("DATABASE_URL") at config load time,
          # so a stub is required for `prisma generate` (no connection made).
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npx vitest run tests/unit

  integration:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-integration
      cancel-in-progress: true
    env:
      DATABASE_URL: postgresql://polaris:polaris@localhost:5432/polaris_test
      SESSION_SECRET: ci-integration-secret
    steps:
      # PostgreSQL is started by hand rather than as a `services:` container,
      # because a service container takes exactly one image reference and the
      # job dies at "Initialize containers" if that one registry refuses. Every
      # anonymous registry does, sooner or later: hosted runners share egress
      # IPs, so Docker Hub's pull rate limit failed this job for hours at a time
      # (we moved to AWS's mirror for that), and on 2026-10-14 AWS's mirror
      # answered `toomanyrequests: Data limit exceeded` and skipped the image
      # build in turn. All three references below are the same official
      # Docker Hub `postgres` image, served by three independent mirrors; the
      # first one that answers wins. Started before `npm ci` so the database
      # boots while dependencies install; "Wait for PostgreSQL" gates on it.
      - name: Start PostgreSQL 17
        run: |
          set -uo pipefail
          image=""
          for ref in \
            public.ecr.aws/docker/library/postgres:17-alpine \
            mirror.gcr.io/library/postgres:17-alpine \
            docker.io/library/postgres:17-alpine; do
            for attempt in 1 2; do
              if docker pull -q "$ref"; then image="$ref"; break 2; fi
              echo "::warning::pull of $ref failed (attempt $attempt)"
              sleep 5
            done
          done
          if [ -z "$image" ]; then
            echo "::error::PostgreSQL image could not be pulled from any mirror"
            exit 1
          fi
          echo "Using $image"
          docker run -d --name postgres \
            -e POSTGRES_USER=polaris \
            -e POSTGRES_PASSWORD=polaris \
            -e POSTGRES_DB=polaris_test \
            -p 5432:5432 \
            "$image"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The container started above is PostgreSQL 17; ubuntu-24.04's own
      # pg_dump is 16, and pg_dump refuses to dump a server newer than itself.
      # Without this step backupRestore.test.ts fails on the rule-47 guard in
      # pgClientTools — which is exactly what it is there to do, and what broke
      # this workflow for 200 commits from 2026-09-10.
      #
      # It has to be the VERSIONED package, never the `postgresql-client`
      # metapackage: that resolves to whatever the Ubuntu release froze on (16
      # on 24.04), so `command -v pg_dump` would succeed and every backup would
      # still refuse. Same trap as deploy/setup-ubuntu-nodb.sh, same fix.
      #
      # /usr/lib/postgresql/<major>/bin is the FIRST place pgToolCandidates
      # looks, so no $GITHUB_PATH edit is needed and CI exercises the same
      # `source: "versioned-dir"` resolution production uses. The runner image
      # normally carries the PGDG list already (its own PostgreSQL comes from
      # there); add it when absent, because Ubuntu's archive has no 17.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            if ! ls /etc/apt/sources.list.d/ | grep -qi pgdg; then
              sudo install -d /usr/share/postgresql-common/pgdg
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            fi
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client-17
          fi
          # Assert it, rather than trusting the install: a silent miss here
          # reappears as an unexplained backup refusal three jobs later.
          /usr/lib/postgresql/17/bin/pg_dump --version

      # The entrypoint runs a temporary server for initdb before the real one,
      # so pg_isready can answer once and then drop; require it inside the
      # container AND a real query over TCP, as the service health check did.
      - name: Wait for PostgreSQL
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U polaris -d polaris_test > /dev/null 2>&1 \
              && PGPASSWORD=polaris psql -h localhost -U polaris -d polaris_test -tAc 'select 1' > /dev/null 2>&1; then
              echo "PostgreSQL ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::PostgreSQL did not become ready within 60s"
          docker logs postgres
          exit 1

      - name: Apply migrations
        run: npx prisma migrate deploy

      # The integration suites share one database and wipe tables in beforeEach,
      # so they MUST run serially — parallel files stomp each other's rows.
      - name: Run integration tests
        run: npx vitest run tests/integration --no-file-parallelism

      # A service container printed the server log at teardown for free; a
      # hand-started one does not, and that log is where a constraint violation
      # behind a failing test shows up.
      - name: PostgreSQL server log
        if: failure()
        run: docker logs postgres 2>&1 | tail -n 300

  build:
    needs: [test, integration]
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed so `git rev-list --count HEAD` returns the
          # real commit count for the sidebar version display.
          fetch-depth: 0
          # This job holds packages:write and id-token:write. It never pushes
          # to the repository, so the checkout token must not be left behind
          # in .git/config for the build steps to find.
          persist-credentials: false

      # Branch protection covers pushes to main. It does NOT cover TAGS: anyone
      # with write access can create `v1.2.3` pointing at any commit — including
      # one that never passed review — and this workflow would build it, publish
      # it to GHCR under a semver tag, and sign it with a provenance attestation
      # that downstream consumers are meant to trust. So a release tag has to be
      # reachable from the default branch or nothing is built.
      # Asked through the API rather than with a local fetch on purpose: the
      # checkout above deliberately keeps no credentials, so there is nothing
      # on disk to authenticate a fetch of the default branch with. `compare`
      # reports the tag's position relative to that branch — "identical" or
      # "behind" both mean every commit in the tag is already on it.
      - name: Refuse a release tag that is not on the default branch
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq '.status')
          echo "Tag $GITHUB_REF_NAME is '$status' relative to $DEFAULT_BRANCH."
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from $DEFAULT_BRANCH ($status). Refusing to publish an attested image from an unreviewed commit."
              exit 1
              ;;
          esac

      - name: Compute commit count
        id: commit-count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            POLARIS_BUILD_COMMIT_COUNT=${{ steps.commit-count.outputs.count }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
