# Polaris multi-process deployment, nginx-fronted (Phase 3+).
#
# Topology:
#   nginx    → terminates TLS on 443 (HTTP/2 + HTTP/3), path-routes to:
#              / → polaris-web:3000
#              /dash → polaris-dash:3001
#              /metrics-monitor-N → polaris-monitor-N:9101
#              /metrics-discovery → polaris-discovery:9110
#   migrate  → one-shot `prisma migrate deploy`; everyone depends on it
#   web      → Express + agent WS + schedulers (single instance)
#   monitor  → pg-boss monitor consumers (N replicas; default 2)
#   discovery → pg-boss discovery consumer
#   dash     → unauthenticated read-only Dash wallboard listener (default
#              OFF until enabled under Server Settings → Certificates)
#
# Single-process polaris.service is no longer supported as a production
# deployment shape — every fresh install is split-role + nginx-fronted.
# Local dev (npm run dev with POLARIS_ROLE unset) runs Node directly, no
# Docker needed.
#
# Cert + nginx config live in ./state/nginx/ so they survive volume mounts.
# Replace ./state/nginx/cert.pem and ./state/nginx/key.pem with your real
# CA cert; the bundled self-signed cert is for local stack-up only.
#
# Secrets via env_file (./state/.env) or your orchestrator's secret store —
# do NOT inline DATABASE_URL / SESSION_SECRET / POLARIS_SECRET_KEY here.
# POLARIS_ROLE is set per-service in this file and kept OUT of .env.
#
# POLARIS_SECRET_KEY encrypts device + integration credentials at rest. It is
# NOT auto-generated for container deployments (no first-run wizard runs), so
# put one in ./state/.env — `openssl rand -hex 32` — or those values are stored
# as plaintext and appear in plaintext in every pg_dump. Back the key up off
# this host: sealed secrets cannot be recovered without it.

x-polaris-common: &polaris-common
  # Published image; override with POLARIS_IMAGE for a locally-built tag.
  image: ${POLARIS_IMAGE:-ghcr.io/rogers-group-inc/polaris:latest}
  restart: unless-stopped
  env_file:
    - ./state/.env
  volumes:
    - ./state:/app/state
  environment:
    POLARIS_STATE_DIR: /app/state
    # Polaris listens HTTP-only on 127.0.0.1:3000 inside the web container;
    # nginx is the only thing exposed to the outside world. Set on every
    # role for env parity even though only web binds.
    POLARIS_PROXY_CERT_PATH: /app/state/nginx/cert.pem
    POLARIS_PUBLIC_URL:      ${POLARIS_PUBLIC_URL:-https://localhost}
    # On a network that re-signs HTTPS with an internal CA, add to ./state/.env:
    #   NODE_EXTRA_CA_CERTS=/app/state/internal-root.pem
    # and drop that PEM into ./state/ — already mounted, so no extra volume.
    # Node ships its own CA store and ignores the image's, so without this the
    # app's outbound calls fail UNABLE_TO_GET_ISSUER_CERT_LOCALLY: Entra/Graph
    # and Azure Arc discovery, the weekly IEEE OUI refresh, weather and map
    # tiles, webhook delivery. Unlike a script install there is no `npm ci`
    # here — the image is prebuilt — so updates are unaffected either way.
    # Set it via env_file, not as a default here: Node reads it before any
    # JavaScript runs, and a default would point it at a nonexistent path.

services:
  nginx:
    image: nginx:mainline
    restart: unless-stopped
    ports:
      - "443:443/tcp"
      - "443:443/udp"   # HTTP/3 over QUIC
    volumes:
      # The reference config from deploy/nginx/polaris.conf (mounted RO).
      # Operators replace the <PROMETHEUS_IP> placeholder before bringing
      # the stack up, or add a drop-in via ./state/nginx/conf.d/*.conf.
      - ./deploy/nginx/polaris.conf:/etc/nginx/conf.d/polaris.conf:ro
      - ./state/nginx/cert.pem:/etc/polaris-nginx/cert.pem:ro
      - ./state/nginx/key.pem:/etc/polaris-nginx/key.pem:ro
    depends_on:
      web:
        condition: service_started

  migrate:
    <<: *polaris-common
    restart: "no"
    environment:
      POLARIS_STATE_DIR: /app/state
      POLARIS_ROLE: migrate

  web:
    <<: *polaris-common
    environment:
      POLARIS_STATE_DIR: /app/state
      POLARIS_ROLE: web
      POLARIS_PROXY_CERT_PATH: /app/state/nginx/cert.pem
      POLARIS_PUBLIC_URL:      ${POLARIS_PUBLIC_URL:-https://localhost}
    # No `ports:` block — web is only reachable via nginx now. nginx's
    # depends_on:web:service_started above makes sure nginx waits for web
    # to start before binding 443, avoiding 502s during initial stack-up.
    depends_on:
      migrate:
        condition: service_completed_successfully

  monitor:
    <<: *polaris-common
    environment:
      POLARIS_STATE_DIR: /app/state
      POLARIS_ROLE: monitor
      # Per-replica pool sizing — keep N×(DATABASE_POOL_SIZE +
      # POLARIS_PGBOSS_POOL_SIZE) + web + discovery under Postgres
      # max_connections. See docs/INSTALL.md.
      DATABASE_POOL_SIZE: "12"
      POLARIS_PGBOSS_POOL_SIZE: "10"
      # /metrics listener for Prometheus. Each replica has its own network
      # namespace, so all replicas can share port 9101 — Prometheus reaches
      # them by container name (polaris-monitor-1:9101, polaris-monitor-2:9101).
      # Bind 0.0.0.0 because the default 127.0.0.1 would only be reachable
      # from inside the container. See docs/grafana/README.md.
      POLARIS_METRICS_PORT: "9101"
      POLARIS_METRICS_BIND: "0.0.0.0"
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started

  discovery:
    <<: *polaris-common
    environment:
      POLARIS_STATE_DIR: /app/state
      POLARIS_ROLE: discovery
      # /metrics listener for Prometheus (sibling container reaches it as
      # polaris-discovery:9110). See docs/grafana/README.md.
      POLARIS_METRICS_PORT: "9110"
      POLARIS_METRICS_BIND: "0.0.0.0"
    depends_on:
      migrate:
        condition: service_completed_successfully

  dash:
    <<: *polaris-common
    environment:
      POLARIS_STATE_DIR: /app/state
      POLARIS_ROLE: dash
      POLARIS_PROXY_CERT_PATH: /app/state/nginx/cert.pem
      POLARIS_PUBLIC_URL:      ${POLARIS_PUBLIC_URL:-https://localhost}
      # nginx's /dash location proxies here (polaris-dash:3001). The surface
      # answers 403 until enabled under Server Settings → Certificates →
      # Dash Wallboard; the RFC1918/all-IPs source gate also lives there.
    depends_on:
      migrate:
        condition: service_completed_successfully
