# Polaris HA — see deploy/ha/dropins/README.md
[Unit]
After=
After=network-online.target patroni.service polaris-migrate.service
Requires=
Requires=patroni.service polaris-migrate.service

[Service]
# Second copy of the guard: the web role owns the schedulers, the agent
# WebSocket and the in-app updater, so it is the one unit that must never come
# up on a replica even if someone started it directly rather than via the target.
ExecStartPre=/usr/bin/curl -sf --max-time 3 -o /dev/null http://127.0.0.1:8008/primary
# A demoted node's app is talking to a database that just went read-only. Its
# SIGTERM handler flushes the sample and probe-patch buffers; those writes now
# fail and retry. Cap the wait so the stop finishes long before the reconciler
# needs the tree, instead of holding systemd's default 90s.
TimeoutStopSec=20
EnvironmentFile=-/etc/polaris/local.env
