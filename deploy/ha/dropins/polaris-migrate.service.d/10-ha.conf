# Polaris HA — see deploy/ha/dropins/README.md
[Unit]
# Empty assignment resets the list the shipped unit set, then we re-declare it
# against Patroni. The stock postgresql-<major>.service is masked on an HA node.
After=
After=network-online.target patroni.service
Requires=
Requires=patroni.service

[Service]
# The primary guard. Every other Polaris unit Requires= this one, so a replica
# fails the whole group start here — the app cannot run where PostgreSQL is not
# the Patroni primary, whoever issues the start. Migrating a read-only replica
# would fail anyway; failing fast says why.
ExecStartPre=/usr/bin/curl -sf --max-time 3 -o /dev/null http://127.0.0.1:8008/primary
EnvironmentFile=-/etc/polaris/local.env
