# Polaris HA — see deploy/ha/dropins/README.md
# Template drop-in: applies to every polaris-monitor@N instance.
[Unit]
After=
After=network-online.target patroni.service polaris-migrate.service polaris-web.service
Requires=
Requires=patroni.service polaris-migrate.service

[Service]
# Guarded transitively through polaris-migrate.service (see README).
TimeoutStopSec=20
EnvironmentFile=-/etc/polaris/local.env
