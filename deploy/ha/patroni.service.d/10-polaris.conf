# Polaris HA — drop-in for the PGDG patroni.service.
# Installed to /etc/systemd/system/patroni.service.d/10-polaris.conf.
[Service]
# Carried over from the postgresql-15.service override that docs/INSTALL.md
# prescribes on a single-node install. Polaris runs `SHOW data_directory` and
# then stats the path to report free space on the Maintenance tab and in the
# capacity advisor; the polaris user can only traverse to it if these two
# directories are world-executable. Patroni now starts PostgreSQL, so the
# override has to live here or the disk figures silently disappear.
ExecStartPost=/bin/chmod o+x /var/lib/pgsql
ExecStartPost=/bin/chmod o+x /var/lib/pgsql/15

# Patroni owns a database that must come back after a reboot without help.
Restart=always
RestartSec=10s

# Do not let systemd kill PostgreSQL out from under Patroni on stop: Patroni
# stops it in the right order (and demotes cleanly) itself.
KillMode=mixed
TimeoutStopSec=120
