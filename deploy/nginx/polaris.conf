# deploy/nginx/polaris.conf — reference nginx server block for Polaris.
#
# Phase 1 of the multi-phase plan to move TLS termination out of Node's https
# module and into an external reverse proxy. Operators opt in by running
# `deploy/migrate-to-nginx.sh`, which installs this config + extracts the
# leaf cert/key from Setting.certificates to /etc/polaris-nginx/.
#
# Listener layout:
#   - TCP/443: HTTP/2 (with HTTP/1.1 fallback for old clients, the Polaris
#     Agent's Go stdlib HTTP/2 client, and anything that doesn't speak QUIC).
#   - UDP/443: HTTP/3 over QUIC. `reuseport` distributes load across worker
#     processes at the kernel level if nginx ever runs more than one worker
#     on this listener.
# Browsers connect over TCP first, see the Alt-Svc header, and race UDP on
# subsequent connections — falling back to TCP if QUIC is blocked.
#
# Path routing:
#   - `/` proxies to the Polaris web process on 127.0.0.1:3000.
#   - `/dash` (exact) and `/dash/` (prefix) proxy to the Dash wallboard
#     process (polaris-dash.service, POLARIS_ROLE=dash) on 127.0.0.1:3001.
#     No allow/deny here by design — the enable toggle and the RFC1918-only
#     source-IP gate live in the dash process (Server Settings → Certificates).
#   - `/metrics` proxies to the same web process — useful for parity with
#     existing scrape configs.
#   - `/metrics-monitor-1`, `/metrics-monitor-2`, `/metrics-discovery` route
#     to the worker /metrics listeners on 127.0.0.1:9101/9102/9110. These
#     are bound to the localhost-only metrics listener that ships in
#     src/utils/metricsServer.ts (commit 33a9240 series). Bearer auth is
#     enforced by Polaris itself; nginx adds IP allowlisting as the first
#     defense layer.
#
# WebSocket upgrade behavior: RFC 6455 WebSockets work only over HTTP/1.1
# and HTTP/2. The Polaris Agent's persistent WebSocket and any browser
# WebSocket to the Polaris UI negotiate over TCP — the Alt-Svc header
# doesn't apply to the Upgrade: websocket handshake. The map block below
# produces the canonical "upgrade-when-asked, close-otherwise" Connection
# header so a plain GET doesn't end up with a stray "Connection: upgrade".
#
# Operator customization:
#   - Replace `polaris.example.com` with your hostname.
#   - Replace `<PROMETHEUS_IP>` with the IP of your Prometheus host (or
#     remove the allow/deny if you have other firewall layers). The migrate
#     script substitutes this automatically when run with --prometheus-ip.
#   - Cert paths: /etc/polaris-nginx/cert.pem and /etc/polaris-nginx/key.pem
#     are written by the migrate script with 0640 root:nginx perms.
#
# To validate: `nginx -t` after copying to /etc/nginx/conf.d/polaris.conf.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  # TCP listeners — HTTP/2 (with HTTP/1.1 fallback for old clients)
  listen 443 ssl;
  http2 on;

  # UDP listener — HTTP/3 over QUIC. Requires nginx 1.25+. The migrate
  # script pins nginx.org's stable repo so dnf doesn't replace this with
  # the RHEL AppStream version (which is too old).
  listen 443 quic reuseport;
  http3 on;

  # Advertise HTTP/3 to clients connecting over TCP. ma=86400 = 24h client
  # cache. `always` so the header is sent on every response status, not
  # just 2xx.
  add_header Alt-Svc 'h3=":443"; ma=86400' always;

  server_name polaris.example.com;

  ssl_certificate     /etc/polaris-nginx/cert.pem;
  ssl_certificate_key /etc/polaris-nginx/key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  # QUIC mandates TLS 1.3 — nginx enforces this automatically on the quic
  # listener; the ssl_protocols directive above only constrains the TCP side.
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_early_data on;   # 0-RTT on QUIC for resumed sessions (TLS-1.3 only)

  # Don't advertise the nginx version in the Server header. `off` still sends
  # "Server: nginx" (dropping it entirely needs a third-party module) but stops
  # handing a scanner the exact build to match against a CVE list.
  server_tokens off;

  # Business rule 50. HSTS is emitted HERE, at the edge, and the upstream's copy is stripped
  # immediately below. Polaris also sets this header via helmet (which is what
  # protects an install running Node's own TLS with no proxy in front), so
  # without the hide a proxied response carried the header TWICE. RFC 6797 §8.1
  # says a UA that receives more than one STS header field processes only the
  # first and the response is non-compliant — browsers do not "take the
  # strongest seen", which is what the comment here used to claim.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  proxy_hide_header Strict-Transport-Security;

  # Default proxy headers shared by all locations. The TRUST_PROXY=1 setting
  # in Polaris's .env makes Express honor these so req.ip / req.secure /
  # session-cookie Secure flag all work correctly.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Authorization     $http_authorization;   # bearer preservation
  proxy_http_version 1.1;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  # Generous timeouts for the agent's long-lived WebSocket. The default 60s
  # would tear down idle WS connections every minute. The agent's own
  # heartbeat fires inside this window.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # Request-body ceiling. nginx defaults to 1m, which is BELOW what Polaris's
  # own handlers accept and silently rejected them at the edge — a 413 whose
  # HTML error page the browser then failed to parse as JSON. The app is the
  # real enforcement layer (express.json is capped at 1mb; each multer route
  # sets its own fileSize — 256k device icons, 1m MIBs/certs, 5m branding
  # logo), so this is defense-in-depth sized just above the largest of them.
  # Raise only if a route's own limit is raised to match.
  client_max_body_size 8m;

  # Main app
  location / {
    proxy_pass http://127.0.0.1:3000;
  }

  # ─── Database restore upload ──────────────────────────────────────────
  # The one route with no size ceiling of its own, deliberately: a restore
  # takes a pg_dump of the whole database, which scales with the fleet's
  # sample volume (docs/INSTALL.md sizes the DB volume at 50-100 GB+), and
  # backupService streams it to disk rather than buffering it. Any finite
  # number here would be a guess that silently breaks somebody's restore —
  # which is the bug this block exists to fix — so the limit is lifted.
  #
  # Two reasons that's safe rather than an open door:
  #   * proxy_request_buffering off — nginx streams straight to the app
  #     instead of spooling the whole upload into client_body_temp first, so
  #     an oversized body can't fill nginx's temp volume.
  #   * On that route Polaris runs its rate limiter and the
  #     serverSettingsData=fullwrite permission check BEFORE multer touches
  #     the body, so an unauthenticated POST is refused without a byte
  #     reaching disk.
  location = /api/v1/server-settings/database/restore {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3000;
  }

  # ─── Dash wallboard ───────────────────────────────────────────────────
  # Unauthenticated read-only /dash surface (polaris-dash.service). App-level
  # gates only — see the Path routing note at the top of this file.
  location = /dash {
    proxy_pass http://127.0.0.1:3001;
  }

  location /dash/ {
    proxy_pass http://127.0.0.1:3001;
  }

  # ─── Metrics endpoints ────────────────────────────────────────────────
  # IP-allowlisted to Prometheus. Bearer auth (METRICS_TOKEN) gates the
  # upstream. Two layers of defense. Edit the allow line to match your
  # Prometheus host's IP — the migrate script substitutes <PROMETHEUS_IP>.
  location = /metrics {
    allow <PROMETHEUS_IP>;
    deny all;
    proxy_pass http://127.0.0.1:3000/metrics;
  }

  location = /metrics-monitor-1 {
    allow <PROMETHEUS_IP>;
    deny all;
    proxy_pass http://127.0.0.1:9101/metrics;
  }

  location = /metrics-monitor-2 {
    allow <PROMETHEUS_IP>;
    deny all;
    proxy_pass http://127.0.0.1:9102/metrics;
  }

  location = /metrics-discovery {
    allow <PROMETHEUS_IP>;
    deny all;
    proxy_pass http://127.0.0.1:9110/metrics;
  }

  # ─── API documentation (/api) ─────────────────────────────────────────
  # The unauthenticated developer-docs page, source-IP scoped from Server
  # Settings → API Tokens (the `apiDocsConfig` Setting). The allows below are
  # the shipped default (RFC1918 + loopback), matching the app's own default;
  # the app-level gate in src/app.ts is the authoritative enforcement and this
  # block is defense in depth (managed installs re-render it from the Setting
  # on apply/update). Exact match only — /api/v1 traffic never matches, and
  # /api/ + /api.html fall through to `location /` where the app gates them.
  location = /api {
    allow 127.0.0.0/8;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://127.0.0.1:3000;
  }
}
